<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f0e8">
  <title>Londra · 5–8 dicembre</title>
  <link rel="stylesheet" href="styles.css?v=b8febce">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-button" id="menuButton" type="button" aria-label="Apri menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">LDN</span>
        <span class="brand-title">Viaggio a Londra</span>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="mapViewButton" type="button" aria-label="Mostra mappa delle tappe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15M15 6v15"/></svg>
        </button>
        <button class="icon-button" id="diaryButton" type="button" aria-label="Apri diario">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2V3Z"/><path d="M8 3v18M11 8h5M11 12h5"/></svg>
        </button>
        <button class="icon-button" id="capsuleButton" type="button" aria-label="Apri capsule sonore">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
        </button>
        <button class="icon-button" id="summaryButton" type="button" aria-label="Apri riepilogo giornata">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/><circle cx="4" cy="10" r="1"/><circle cx="10" cy="4" r="1"/><circle cx="16" cy="13" r="1"/></svg>
        </button>
        <button class="icon-button" id="themeButton" type="button" aria-label="Attiva modalità notte">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a8 8 0 1 1-11-11 9 9 0 0 0 11 11Z"/></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow" id="tripCountdown">5–8 dicembre 2026</p>
        <h1>Buongiorno,<br>è tempo di <em>Londra.</em></h1>
      </div>
      <div class="weather" aria-label="Meteo a Londra">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 34h23a7 7 0 0 0 0-14 11 11 0 0 0-21-3A8.5 8.5 0 0 0 12 34Z"/>
        </svg>
        <div><strong>11°</strong><span>Nuvoloso</span></div>
      </div>
    </section>

    <nav class="date-tabs" aria-label="Giorni del viaggio" id="dateTabs">
      <button class="date-tab active" type="button" data-day="0">
        <span>Sab</span><strong>05</strong>
      </button>
      <button class="date-tab" type="button" data-day="1">
        <span>Dom</span><strong>06</strong>
      </button>
      <button class="date-tab" type="button" data-day="2">
        <span>Lun</span><strong>07</strong>
      </button>
      <button class="date-tab" type="button" data-day="3">
        <span>Mar</span><strong>08</strong>
      </button>
    </nav>

    <section class="day-summary" aria-live="polite">
      <div>
        <p class="section-kicker" id="dayKicker">Primo giorno</p>
        <h2 id="dayTitle">Il West End</h2>
      </div>
      <div class="route-pill" id="routePill">
        <span></span> 7 tappe
      </div>
    </section>

    <section class="timeline" id="timeline" aria-label="Itinerario della giornata"></section>

    <div class="route-actions" aria-label="Modalità percorso">
      <button class="mode-button active" type="button" data-mode="walking">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7-3-3 2-5 4 3 3 1M12 15l4 2 2 5"/></svg>
        A piedi
      </button>
      <button class="mode-button" type="button" data-mode="transit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M8 21l2-3m6 3-2-3M8 7h8M8 11h8"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>
        In metro
      </button>
    </div>
    <button class="map-button" type="button" id="mapButton">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12A7 7 0 1 0 5 9c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Apri tutto il percorso
    </button>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Opzioni percorso</h2>
      <button class="icon-button" id="closeDrawer" type="button" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="drawerContent"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <template id="timelineTemplate">
    <article class="stop">
      <div class="time">
        <span class="dot"></span>
        <strong></strong>
      </div>
      <div class="stop-card">
        <div class="stop-icon"></div>
        <div class="stop-copy">
          <p class="stop-label"></p>
          <h3></h3>
          <p class="stop-detail"></p>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js?v=b8febce"></script>
  <script src="capsules.js?v=b8febce"></script>
</body>
</html>
